<!doctype html>
<!-- @author kongweiguang -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kerminal v0.3.8 宣传片 · B站横屏</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="landscape">
  <main class="stage" aria-label="Kerminal v0.3.8 宣传片横屏动画">
    <div class="grid-field" aria-hidden="true"></div>
    <header class="brand-mark">
      <img src="assets/images/kerminal-icon.png" alt="" />
      <span>KERMINAL</span>
      <b>v0.3.8</b>
    </header>

    <section id="opening" class="opening">
      <div class="opening-icon"><img src="assets/images/kerminal-icon.png" alt="Kerminal" /></div>
      <p>TERMINAL · REMOTE · AGENT</p>
      <h1>终端，<br />不该只是一块黑色窗口。</h1>
      <i class="cursor" aria-hidden="true"></i>
    </section>

    <section id="featureCopy" class="feature-copy" aria-live="polite">
      <p id="eyebrow"></p>
      <h2 id="headline"></h2>
      <p id="detail"></p>
    </section>

    <section id="workbench" class="workbench">
      <div class="window-bar"><span></span><span></span><span></span><b id="windowLabel">CURRENT TARGET · PROD-API</b></div>
      <div class="screen-stack">
        <img class="shot" data-key="hero" src="assets/images/kerminal-hero.png" alt="Kerminal 三栏工作台" />
        <img class="shot" data-key="agent" src="assets/images/kerminal-agent.png" alt="Kerminal Agent 会话" />
        <img class="shot" data-key="sftp" src="assets/images/kerminal-sftp.png" alt="Kerminal SFTP 工作台" />
        <img class="shot" data-key="docker" src="assets/images/kerminal-docker.png" alt="Kerminal 容器管理" />
        <img class="shot" data-key="system" src="assets/images/kerminal-system.png" alt="Kerminal 系统监控" />
        <div id="focusRing" class="focus-ring"><span>当前目标</span></div>
      </div>
    </section>

    <nav id="featureRail" class="feature-rail" aria-label="视频功能章节">
      <span>工作台</span><span>Agent</span><span>SFTP</span><span>容器</span><span>监控</span>
    </nav>

    <section id="outro" class="outro">
      <img src="assets/images/kerminal-icon.png" alt="Kerminal" />
      <div><p>ONE CONTEXT. EVERY TARGET.</p><h2>Kerminal</h2></div>
      <strong>终端、服务器与 Agent<br />在同一个上下文里协作</strong>
      <small>v0.3.8 · Created by Huashu-Design</small>
    </section>

    <div id="subtitle" class="subtitle"><span></span></div>
  </main>
  <script src="video.js"></script>
</body>
</html>
